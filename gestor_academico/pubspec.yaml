name: gestor_academico
description: Gestor Academico Inteligente - Smart Academic Manager for teachers and students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.0
  firebase_messaging: ^14.7.0

  # UI/UX
  flutter_riverpod: ^2.5.1
  go_router: ^13.0.0
  google_fonts: ^6.1.0

  # QR & Scanner
  qr_flutter: ^4.1.0
  mobile_scanner: ^4.2.0

  # PDF & Reportes
  pdf: ^3.10.0
  printing: ^5.11.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Security
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3

  # AI
  google_generative_ai: ^0.3.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  fl_chart: ^0.66.0
  shimmer: ^3.0.0
  permission_handler: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
